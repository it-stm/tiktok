<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TikTok Comment Check</title>

    <style>
        /* ==========================================================
           1. รูปแบบหน้าเว็บ (ยึดตาม tiktok.php เดิม)
           ========================================================== */
        :root {
            font-family: consolas, system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
            color: #1e293b;
            background: #f1f5f9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 22px;
            margin: 0 0 8px;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .hint {
            color: #64748b;
            font-size: 13px;
        }

        .btn {
            background: #0f172a;
            color: white;
            border: 0;
            text-decoration: none;
            padding: 8px 12px;

            cursor: pointer;
        }

        .error {
            background: #fff0f0;
            color: #991b1b;

            border-radius: 8px;
        }

        .hidden {
            display: none;
        }

        /* ==========================================================
           2. ตารางและ Freeze หัวตาราง 1 แถว
           ========================================================== */
        .table-wrap {
            max-height: calc(100vh - 145px);
            overflow: auto;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: white;
            position: relative;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed;
            width: max-content;
            font-size: 14px;
        }

        th,
        td {

            border-right: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
            padding: 5px 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

            thead th {
                background: #e2e8f0;
                font-weight: 700;
                text-align: center;
                height: 70px;
                position: sticky;
                z-index: 3;

                white-space: pre-wrap;
                overflow-wrap: anywhere;
                text-overflow: clip;
                line-height: 1.4;
                vertical-align: middle;

        thead tr:first-child th {
            top: 0;
        }

        /* ==========================================================
           3. Freeze คอลัมน์ A (ชื่อคลิป) และ B (URL)
           ========================================================== */
        th:first-child,
        td:first-child {
            position: sticky;
            left: 0;
            z-index: 4;
            box-shadow: 2px 0 3px #00000012;
        }

        th:nth-child(2),
        td:nth-child(2) {
            position: sticky;
            left: var(--first-col-width);
            z-index: 4;
            box-shadow: 2px 0 3px #00000012;
        }

        /* Freeze คอลัมน์ C: date (อยู่ถัดจาก clip_name และ URL) */
        th:nth-child(3),
        td:nth-child(3) {
            position: sticky;
            left: var(--first-two-cols-width);
            z-index: 4;
            box-shadow: 2px 0 3px #00000012;
        }

        thead th:first-child,
        thead th:nth-child(2),
        thead th:nth-child(3) {
            z-index: 8;
            background: #cbd5e1;
        }

        tbody td:first-child,
        tbody td:nth-child(2),
        tbody td:nth-child(3) {
            background: white;
        }

        tbody td:first-child {
            font-weight: 600;
        }

        tbody tr:nth-child(even) td {
            background: #f8fafc;
        }

        tbody tr:hover td {
            background: #eaf2ff;
        }

        /* สีพาสเทลทั้งแถวตามชื่อคลิป รวมคอลัมน์ที่ Freeze และตอน Hover */
        tbody tr.clip-colored td,
        tbody tr.clip-colored:hover td {
            background: var(--clip-row-color);
        }

        tbody td:nth-child(n+3) {
            text-align: center;
        }

        /* เส้นแบ่งคอลัมน์เข้ม (ระบุตำแหน่งใน columnDividers ด้านล่าง) */
        thead th.column-divider,
        tbody td.column-divider {
            border-right: 2px solid #475569;
        }

    a.url {
        color: #2563eb;

        display: block;
        width: 100%;

        direction: rtl;
        text-align: left;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

        td.yes {
            color: #15803d;
            font-weight: bold;
            font-size: 18px;
        }

         /* ตัวเลขยอดคอมเมนต์ ห้ามตัดบรรทัด */
        .header-count {
        display: block;
        white-space: nowrap;

        /* ชื่อผู้ใช้ ตัดบรรทัดได้ */
        .header-name {
            display: block;
            overflow-wrap: anywhere;
        }




        
    </style>
</head>

<body>
    <h1 id="pageTitle">ตรวจสอบคอมเมนต์ TikTok</h1>

    <div class="toolbar">

    <div class="table-wrap hidden" id="tableWrap">

    <script>
        "use strict";

        // ==========================================================
        // 4. ตั้งค่าความกว้างคอลัมน์ (px) แก้ตัวเลขตรงนี้ได้เลย
        // ==========================================================
        const columnWidths = {
            0: 130, // คอลัมน์ A: clip_name (Freeze)
            1: 100, // คอลัมน์ B: clip_url (Freeze)
            2: 95, // คอลัมน์ C: date (Freeze)
            5: 70,  //  อีซูซุสงวนไทยกรุ๊ป
            6: 70,  //  สงวนไทยรถมือสอง
            7: 70,  //  แตงกวา ป้ายแดง
            8: 70,  // แตงกวา รถมือสอง
            11: 65,  // มะปราง 
            14: 75,  // พี่ชนินทร์
            24: 55,  // เอ๋ (คอม)
            28: 60,  // เซลส์เอ๋ ป้ายแดง
            29: 60,  // เซลส์เอ๋ มือสอง
            39: 60,  // เซลส์นัท ป้ายแดง
            45: 55,  // เซลส์นัท มือสอง
            49: 60,  // พี่เฉื่อย (คอม)
            //"16-25": 65  // คอลัมน์ 16 ถึง 24 กว้าง 75px
           
        };

        // เส้นแบ่งเข้ม "หลัง" คอลัมน์ตามหมายเลขที่แสดงบนตาราง (เริ่มนับจาก 1)
        // เช่น 2 = ระหว่างคอลัมน์ 2-3, 7 = ระหว่าง 7-8
        // แก้ตัวเลขในรายการนี้ได้เอง เพิ่ม/ลบได้ตามต้องการ
        const columnDividers = [7, 18, 28, 39, 50];  

        const defaultUserWidth = 50;
        const csvFileName = "COMMENT_CHECK.csv";

        // สีแถวตามคำที่พบใน clip_name (ไม่สนใจตัวพิมพ์เล็ก-ใหญ่)
        // หากชื่อคลิปมีหลายคำที่ตรงกัน จะใช้สีของคำที่อยู่ก่อนในรายการ
        const clipRowColors = [
            { keyword: "nut",     color: "#E0F2FE" }, // ฟ้าอ่อน
            { keyword: "tangkwa", color: "#FCE7F3" }, // ชมพูอ่อน
            { keyword: "ae",      color: "#FFEDD5" }, // ส้มอ่อน
            { keyword: "wine",    color: "#F3E8FF" }, // ม่วงอ่อน
            { keyword: "phol",    color: "#F1F5F9" }  // เทาอ่อน
        ];

        // กฎการนับยอดในหัวตารางตาม @username (อ่านจากหัวตาราง CSV แถวที่สอง)
        // User ที่ไม่ได้อยู่ในรายการนี้จะนับทุกคลิป
        const commentCountGroups = [
            {
                usernames: [
                    "@tangkwaisuzu", "@2carbytangkwa", "@happi.ness1820",
                    "@nichthiranan1215_k", "@sirinn_e", "@parchkrawnuch",
                    "@ozeriskung", "@ninja9stm", "@surasakmuangto",
                    "@rawsixonenines", "@user6156904622615"
                ],
                prefixes: ["tangkwa","phol"]
            },
            {
                usernames: [
                    "@winey744", "@aunnatnicha176", "@bzonyaa",
                    "@maynisa44", "@kaewp99", "@automoshi",
                    "@byaey0", "@xxxlek", "@ajchareeya_kung", 
                    "@xxxblue"
                ],
                prefixes: ["wine"]
            },
            {
                usernames: [
                    "@isuzubyae", "@usecarbyae", "@tu_mooinm",
                    "@xxx", "@xxx", "@lilac_lilala",
                    "@puysumaman", "@18chicha", "@xxx",
                    "@xxx","@xxx"
                ],
                prefixes: ["ae"]
            },
            {
                usernames: [
                    "@pandanutisuzu", "@pandanut_car2", "@synkornizemss",
                    "@wanpatcha", "@piglettt.18", "@yyy",
                    "@sangarunwatananak", "@phon.son7", "@surasitmuangto", 
                    "@yyy", "@301408nn"
                ],
                prefixes: ["nut"]
            }
           
        ];


        
        // ==========================================================
        // กฎการนับยอดหลังชื่อคลิป (แยกจากหัวตาราง)
        // คลิปที่ไม่ได้กำหนดกลุ่ม จะนับ User ทุกคน
        // ==========================================================
        const clipCountGroups = [
            {
                prefixes: ["tangkwa"],
                usernames: [
                    "@tangkwaisuzu", "@2carbytangkwa", "@happi.ness1820",
                    "@nichthiranan1215_k", "@sirinn_e", "@parchkrawnuch",
                    "@ozeriskung", "@ninja9stm", "@surasakmuangto",
                    "@rawsixonenines", "@user6156904622615"
                ]
            },
            {
                prefixes: ["wine"],
                usernames: [
                    "@winey744", "@aunnatnicha176", "@bzonyaa",
                    "@maynisa44", "@kaewp99", "@automoshi",
                    "@byaey0", "@xxxlek", "@ajchareeya_kung", "@xxxblue"
                ]
            },
            {
                prefixes: ["salexxx"],
                usernames: ["@xxx"]
            },
            {
                prefixes: ["saleyyy"],
                usernames: ["@yyy"]
            }
        ];










        

        function normalizedUsername(value) {
            return String(value ?? "").trim().toLowerCase().replace(/^@+/, "");
        }

        const countPrefixesByUser = new Map();
        for (const group of commentCountGroups) {
            for (const username of group.usernames) {
                countPrefixesByUser.set(normalizedUsername(username), group.prefixes);
            }
        }

        // ==========================================================
        // 5. อ่าน CSV และรองรับ UTF-8 / UTF-16 / Windows-874
        // ==========================================================
        function decodeCsv(buffer) {
            const bytes = new Uint8Array(buffer);

            if (bytes[0] === 0xff && bytes[1] === 0xfe) {
                return new TextDecoder("utf-16le").decode(bytes);
            }

            if (bytes[0] === 0xfe && bytes[1] === 0xff) {
                return new TextDecoder("utf-16be").decode(bytes);
            }

            try {
                return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
            } catch (_) {
                return new TextDecoder("windows-874").decode(bytes);
            }
        }

        // รองรับเครื่องหมายคำพูด, comma และบรรทัดใหม่ภายในค่า CSV
        function parseCsv(text) {
            const rows = [];
            let row = [];
            let field = "";
            let inQuotes = false;

            text = text.replace(/^\uFEFF/, "");

            for (let i = 0; i < text.length; i++) {
                const char = text[i];

                if (char === '"') {
                    if (inQuotes && text[i + 1] === '"') {
                        field += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === "," && !inQuotes) {
                    row.push(field);
                    field = "";
                } else if ((char === "\n" || char === "\r") && !inQuotes) {
                    if (char === "\r" && text[i + 1] === "\n") {
                        i++;
                    }

                    row.push(field);
                    if (row.some(cell => cell.trim() !== "")) {
                        rows.push(row);
                    }
                    row = [];
                    field = "";
                } else {
                    field += char;
                }
            }

            row.push(field);
            if (row.some(cell => cell.trim() !== "")) {
                rows.push(row);
            }

            return rows;
        }

        function isCommented(value) {
            return ["✓", "✔", "yes", "true", "1"].includes(value.trim().toLowerCase());
        }

function getColumnWidth(column) {
    // ค่ารายคอลัมน์มีความสำคัญก่อนค่าช่วง
    if (columnWidths[column] !== undefined) {
        return Math.max(30, Number(columnWidths[column]));
    }

    // ตรวจสอบการกำหนดเป็นช่วง
    for (const [range, width] of Object.entries(columnWidths)) {
        const match = range.match(/^(\d+)-(\d+)$/);

        if (match) {
            const start = Number(match[1]);
            const end = Number(match[2]);

            if (column >= start && column <= end) {
                return Math.max(30, Number(width));
            }
        }
    }

    return Math.max(30, defaultUserWidth);
}

        // ==========================================================
        // 6. แสดงหัวตารางเฉพาะแถวแรกและข้อมูล พร้อมยอด (commented/all)
        // ==========================================================
        // ความกว้างของคอลัมน์ที่แสดง: 0=clip_name, 1=URL, 2=date,
        // ตั้งค่าคอลัมน์ User ใน columnWidths ตามเลขเดิมก่อนเพิ่ม date
    function displayColumnWidth(column) {
        return getColumnWidth(column);
    }

        function drawTable(rows) {
            if (rows.length < 2) {
                throw new Error("CSV ต้องมีหัวตาราง 2 แถว (display_name และ @username)");
            }

            // ย้าย date จากคอลัมน์ท้าย CSV มาแสดงที่ C โดยไม่เปลี่ยนไฟล์ CSV
            // หน้า index.html ยังแสดงทุกคลิป ไม่กรองวันที่
            const dateColumn = rows[0].findIndex(cell => String(cell).trim().toLowerCase() === "date");
            if (dateColumn === -1) {
                throw new Error("COMMENT_CHECK.csv ต้องมีคอลัมน์ date");
            }
            rows = rows.map(row => {
                const result = [...row];
                const [dateValue] = result.splice(dateColumn, 1);
                result.splice(2, 0, dateValue ?? "");
                return result;
            });

            const columns = Math.max(...rows.map(row => row.length));
            rows = rows.map(row => Array.from({ length: columns }, (_, i) => row[i] ?? ""));

            // เรียงเฉพาะแถวข้อมูลตาม clip_name (A-Z, ไม่สนตัวพิมพ์เล็กใหญ่)
            // คงหัวตาราง CSV สองแถวแรกไว้ และเรียงแบบตัวเลขตามธรรมชาติ เช่น clip2 ก่อน clip10
            const sortedClips = rows.slice(2).sort((a, b) =>
                String(a[0]).localeCompare(String(b[0]), undefined, {
                    sensitivity: "base",
                    numeric: true
                })
            );
            rows = [...rows.slice(0, 2), ...sortedClips];

            const clipCount = Math.max(0, rows.length - 2);
            const totalUsers = Math.max(0, columns - 3);
            const commentedCounts = Array(columns).fill(0);
            const eligibleClipCounts = Array(columns).fill(clipCount);
            const commentedPerClip = Array(rows.length).fill(0);

            // กำหนดขอบเขตคลิปที่จะนับของแต่ละคน โดยใช้ @username ใน CSV แถวที่สอง
            const userPrefixes = Array.from({ length: columns }, (_, c) =>
                c >= 3 ? countPrefixesByUser.get(normalizedUsername(rows[1][c])) : undefined
            );
            for (let c = 3; c < columns; c++) {
                if (userPrefixes[c]) eligibleClipCounts[c] = 0;
            }

            for (let r = 2; r < rows.length; r++) {
                const clipNameForCount = String(rows[r][0]).trim().toLowerCase();
                for (let c = 3; c < columns; c++) {
                    const commented = isCommented(rows[r][c]);
                    // จำนวนคอมเมนต์ต่อคลิปยังคงนับทุก User ที่มีเครื่องหมาย ✓
                    if (commented) commentedPerClip[r]++;
                    const prefixes = userPrefixes[c];
                    const eligible = !prefixes || prefixes.some(prefix => clipNameForCount.startsWith(prefix));
                    if (eligible) {
                        if (prefixes) eligibleClipCounts[c]++;
                        if (commented) commentedCounts[c]++;
                    }
                }
            }



            
        // ==========================================================
        // คำนวณยอดหลังชื่อคลิปตาม clipCountGroups
        // ==========================================================
        const clipUserTotals = Array(rows.length).fill(totalUsers);

        // รองรับ date ที่อยู่คอลัมน์ 3
        const firstUserColumn =
            String(rows[0][2] ?? "").trim().toLowerCase() === "date"
                ? 3 : 2;

        for (let r = 2; r < rows.length; r++) {
            const clipName = String(rows[r][0]).trim().toLowerCase();

            const group = clipCountGroups.find(g =>
                g.prefixes.some(prefix =>
                    prefix && clipName.startsWith(prefix.toLowerCase())
                )
            );

            // ไม่มีเงื่อนไขเฉพาะ: คงยอดนับทุก User
            if (!group) continue;

            const allowedUsers = new Set(
                group.usernames.map(normalizedUsername)
            );

            let found = 0;
            let total = 0;

            for (let c = firstUserColumn; c < columns; c++) {
                const username = normalizedUsername(rows[1][c]);

                if (allowedUsers.has(username)) {
                    total++;

                    if (isCommented(rows[r][c])) {
                        found++;
                    }
                }
            }

            commentedPerClip[r] = found;
            clipUserTotals[r] = total;
        }





            
            const table = document.getElementById("commentsTable");
            table.replaceChildren();

            const colgroup = document.createElement("colgroup");
            for (let c = 0; c < columns; c++) {
                const col = document.createElement("col");
                col.style.width = displayColumnWidth(c) + "px";
                colgroup.appendChild(col);
            }
            table.appendChild(colgroup);

            const thead = document.createElement("thead");
            for (let r = 0; r < 1; r++) {
                const tr = document.createElement("tr");

                for (let c = 0; c < columns; c++) {
                    const th = document.createElement("th");

                    
                    const text = String(rows[r][c]);

            if (c >= 3) {
                const count = document.createElement("span");
                count.className = "header-count";
                count.textContent =
                    `(${commentedCounts[c]}/${eligibleClipCounts[c]})`;

                const name = document.createElement("span");
                name.className = "header-name";
                name.textContent = text;

                th.append(count, name);
                th.title = count.textContent + "\n" + text;
            } else {
                th.textContent = text;
                th.title = text;
            }

                    
                    setCellWidth(th, c);
                    if (columnDividers.includes(c + 1)) th.classList.add("column-divider");
                    tr.appendChild(th);
                }

                thead.appendChild(tr);
            }
            table.appendChild(thead);

            const tbody = document.createElement("tbody");
            for (let r = 2; r < rows.length; r++) {
                const tr = document.createElement("tr");
                const clipName = String(rows[r][0]).toLowerCase();
                const matchedColor = clipRowColors.find(item => clipName.includes(item.keyword));
                if (matchedColor) {
                    tr.classList.add("clip-colored");
                    tr.style.setProperty("--clip-row-color", matchedColor.color);
                }

                for (let c = 0; c < columns; c++) {
                    const td = document.createElement("td");
                    const value = String(rows[r][c]).trim();
                    const commented = c >= 3 && isCommented(value);

                    setCellWidth(td, c);
                    if (columnDividers.includes(c + 1)) td.classList.add("column-divider");

                    if (commented) {
                        td.classList.add("yes");
                    }

                    if (c === 1 && /^https?:\/\//i.test(value)) {
                        const link = document.createElement("a");
                        link.className = "url";
                        link.href = value;
                        link.target = "_blank";
                        link.rel = "noopener noreferrer";
                        link.title = value;
                        link.textContent = value;
                        td.appendChild(link);
                    } else {
                        td.textContent = c === 0
                            ? `${value} (${commentedPerClip[r]}/${clipUserTotals[r]})`
                            : value;
                        td.title = td.textContent;
                    }

                    tr.appendChild(td);
                }

                tbody.appendChild(tr);
            }
            table.appendChild(tbody);

            const tableWrap = document.getElementById("tableWrap");
            tableWrap.style.setProperty("--first-col-width", displayColumnWidth(0) + "px");
            tableWrap.style.setProperty("--first-two-cols-width", (displayColumnWidth(0) + displayColumnWidth(1)) + "px");
            document.getElementById("summary").innerHTML =
                `<a href="https://docs.google.com/spreadsheets/d/1CTi0ZpyTyESYyiiYXDZdk5m1mq5X81VOW-ObHezuJ5o/edit?gid=886166879#gid=886166879" target="_blank">จำนวนคลิป</a>: ${clipCount} |
                 <a href="https://docs.google.com/spreadsheets/d/1CTi0ZpyTyESYyiiYXDZdk5m1mq5X81VOW-ObHezuJ5o/edit?gid=1397412964#gid=1397412964" target="_blank">จำนวนบัญชี</a>: ${totalUsers}`;
        }

        function setCellWidth(cell, column) {
            const width = displayColumnWidth(column) + "px";
            cell.style.width = width;
            cell.style.minWidth = width;
            cell.style.maxWidth = width;
        }

        // ==========================================================
        // 7. โหลดข้อมูลบน GitHub Pages (ไม่ใช้ PHP หรือฐานข้อมูล)
        // ==========================================================
        async function loadData() {
            const errorBox = document.getElementById("errorMessage");
            const tableWrap = document.getElementById("tableWrap");

            errorBox.classList.add("hidden");
            tableWrap.classList.add("hidden");
            document.getElementById("summary").textContent = "กำลังโหลด COMMENT_CHECK.csv...";

            try {
                const response = await fetch(csvFileName, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`โหลด ${csvFileName} ไม่สำเร็จ (HTTP ${response.status})`);
                }

                const csvText = decodeCsv(await response.arrayBuffer());
                drawTable(parseCsv(csvText));
                tableWrap.classList.remove("hidden");

             
               // วันที่ปัจจุบันตามเวลาไทย + เวลาที่กำหนดเอง
            const today = new Intl.DateTimeFormat("en-GB", {
                timeZone: "Asia/Bangkok",
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }).format(new Date());

            document.getElementById("pageTitle").textContent =
                `ตรวจสอบคอมเมนต์ TikTok ${today} 8:20`;
              } catch (error) {
                   errorBox.textContent = String(error.message || error);
                  errorBox.classList.remove("hidden");
                 document.getElementById("summary").textContent = "ไม่สามารถแสดงข้อมูลได้";
             }
         }

        loadData();
    </script>
</body>
</html>

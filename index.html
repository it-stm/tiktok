    <script>
        "use strict";

        // ==========================================================
        // 4. ตั้งค่าความกว้างคอลัมน์ (px) แก้ตัวเลขตรงนี้ได้เลย
        // ==========================================================
       const columnWidths = {
            0: 85,  // คอลัมน์ A: clip_name (Freeze)
            1: 65,  // คอลัมน์ B: comment (Freeze)  
            2: 100, // คอลัมน์ C: clip_url (Freeze)
            3: 90,  // คอลัมน์ D: date (Freeze)
            6: 75,  // อีซูซุ สงวนไทย

            8: 65,  // แตงกวา ป้ายแดง
            9: 65,  // แตงกวา รถมือสอง
            29: 65, // เซลส์เอ๋ ป้ายแดง
            30: 65, // เซลส์เอ๋ มือสอง
            40: 65, // เซลส์นัท ป้ายแดง
            41: 65, // เซลส์นัท มือสอง

            // "17-26": 65 // ตัวอย่างช่วงคอลัมน์ 
        };

            

        // เส้นแบ่งเข้ม "หลัง" คอลัมน์ตามหมายเลขที่แสดงบนตาราง (เริ่มนับจาก 1)
        // เช่น 2 = ระหว่างคอลัมน์ 2-3, 7 = ระหว่าง 7-8
        // แก้ตัวเลขในรายการนี้ได้เอง เพิ่ม/ลบได้ตามต้องการ
        const columnDividers = [0, 3, 7, 18, 28, 39, 50];  

        // สีพื้นหลังหัวตาราง ตามหมายเลขคอลัมน์ที่แสดงจริง (เริ่มจาก 1)
        const headerColorGroups = [
            {
                columns: [8, 18],
                // color: "#F0FDF4"  // tangkwa - เขียวอ่อน
                color: "#FCE7F3"  // tangkwa - ชมพู    
            },
            {
                columns: [19, 28],
                color: "#F3E8FF"  // wine - ม่วง
            },
            {
                columns: [29, 39],
                color: "#FFEDD5"  // ae - ส้ม
            },
            {
                columns: [40, 50],
                color: "#E0F2FE"  // nut - ฟ้า
            }
        ];
 
        const defaultUserWidth = 65;
        const csvFileName = "COMMENT_CHECK.csv";

        // สีแถวตามคำที่พบใน clip_name (ไม่สนใจตัวพิมพ์เล็ก-ใหญ่)
        // หากชื่อคลิปมีหลายคำที่ตรงกัน จะใช้สีของคำที่อยู่ก่อนในรายการ
        const clipRowColors = [
            { keyword: "nut",     color: "#E0F2FE" }, // ฟ้าอ่อน
            // { keyword: "tangkwa", color: "#F0FDF4" }, // เขียวอ่อน
            { keyword: "tangkwa", color: "#FCE7F3" }, // ชมพูอ่อน
            { keyword: "ae",      color: "#FFEDD5" }, // ส้มอ่อน
            { keyword: "wine",    color: "#F3E8FF" }, // ม่วงอ่อน
            { keyword: "phol",    color: "#F1F5F9" }  // เทาอ่อน
        ];


            // เรียงลำดับ clip_name
            const clipSortOrder = [
            "phol",
            "tangkwa",
            "wine",
            "ae",
            "nut"
        ];


        

        // กฎการนับยอดในหัวตารางตามตำแหน่งคอลัมน์เดิมก่อนเพิ่มยอด
        // User ที่ไม่ได้อยู่ในรายการนี้จะนับทุกคลิป
       const commentCountGroups = [
            {
                columns: [8, 18],
                prefixes: ["tangkwa", "phol"]
            },
            {
                columns: [19, 28],
                prefixes: ["wine"]
            },
            {
                columns: [29, 39],
                prefixes: ["ae"]
            },
            {
                columns: [40, 50],
                prefixes: ["nut"]
            }
        ];


        
        // ==========================================================
        // กฎการนับยอดหลังชื่อคลิป (แยกจากหัวตาราง)
        // คลิปที่ไม่ได้กำหนดกลุ่ม จะนับ User ทุกคน
        // ==========================================================
        const clipCountGroups = [
    {
        prefixes: ["tangkwa"],
        columns: [8, 18]
    },
    {
        prefixes: ["wine"],
        columns: [19, 28]
    },
    {
        prefixes: ["ae"],
        columns: [29, 39]
    },
    {
        prefixes: ["nut"],
        columns: [40, 50]
    }
];








        

        function normalizedUsername(value) {
            return String(value ?? "").trim().toLowerCase().replace(/^@+/, "");
        }


        

          const countPrefixesByColumn = new Map();

            for (const group of commentCountGroups) {
                const [start, end] = group.columns;

                    for (let column = start; column <= end; column++) {
                        countPrefixesByColumn.set(column, group.prefixes);
            }
        }


 
        

        // ==========================================================
        // 5. อ่าน CSV และรองรับ UTF-8 / UTF-16 / Windows-874
        // ==========================================================
        function decodeCsv(buffer) {
            const bytes = new Uint8Array(buffer);

            if (bytes[0] === 0xff && bytes[1] === 0xfe) {
                return new TextDecoder("utf-16le").decode(bytes);
            }

            if (bytes[0] === 0xfe && bytes[1] === 0xff) {
                return new TextDecoder("utf-16be").decode(bytes);
            }

            try {
                return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
            } catch (_) {
                return new TextDecoder("windows-874").decode(bytes);
            }
        }

        // รองรับเครื่องหมายคำพูด, comma และบรรทัดใหม่ภายในค่า CSV
        function parseCsv(text) {
            const rows = [];
            let row = [];
            let field = "";
            let inQuotes = false;

            text = text.replace(/^\uFEFF/, "");

            for (let i = 0; i < text.length; i++) {
                const char = text[i];

                if (char === '"') {
                    if (inQuotes && text[i + 1] === '"') {
                        field += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === "," && !inQuotes) {
                    row.push(field);
                    field = "";
                } else if ((char === "\n" || char === "\r") && !inQuotes) {
                    if (char === "\r" && text[i + 1] === "\n") {
                        i++;
                    }

                    row.push(field);
                    if (row.some(cell => cell.trim() !== "")) {
                        rows.push(row);
                    }
                    row = [];
                    field = "";
                } else {
                    field += char;
                }
            }

            row.push(field);
            if (row.some(cell => cell.trim() !== "")) {
                rows.push(row);
            }

            return rows;
        }

        function isCommented(value) {
            return ["✓", "✔", "yes", "true", "1"].includes(value.trim().toLowerCase());
        }

function getColumnWidth(column) {
    // ค่ารายคอลัมน์มีความสำคัญก่อนค่าช่วง
    if (columnWidths[column] !== undefined) {
        return Math.max(30, Number(columnWidths[column]));
    }

    // ตรวจสอบการกำหนดเป็นช่วง
    for (const [range, width] of Object.entries(columnWidths)) {
        const match = range.match(/^(\d+)-(\d+)$/);

        if (match) {
            const start = Number(match[1]);
            const end = Number(match[2]);

            if (column >= start && column <= end) {
                return Math.max(30, Number(width));
            }
        }
    }

    return Math.max(30, defaultUserWidth);
}

        // ==========================================================
        // 6. แสดงหัวตารางเฉพาะแถวแรกและข้อมูล พร้อมยอด (commented/all)
        // ==========================================================
        // ความกว้างของคอลัมน์ที่แสดง: 0=clip_name, 1=URL, 2=date,
        // columnWidths ใช้ index คอลัมน์เดิม (0-based) ก่อนเพิ่มคอลัมน์ยอด
    function displayColumnWidth(column) {
        return getColumnWidth(column);
    }

        function drawTable(rows) {
            if (rows.length < 2) {
                throw new Error("CSV ต้องมีหัวตาราง 2 แถว (display_name และ @username)");
            }

            // ย้าย date จากคอลัมน์ท้าย CSV มาแสดงที่ C โดยไม่เปลี่ยนไฟล์ CSV
            // หน้า index.html ยังแสดงทุกคลิป ไม่กรองวันที่
            const dateColumn = rows[0].findIndex(cell => String(cell).trim().toLowerCase() === "date");

        // อ่านเวลาสร้างไฟล์จากหัวตาราง CSV แถวที่สอง
        const createdTime = dateColumn !== -1
            ? String(rows[1][dateColumn] ?? "").trim()
            : "";

        // เก็บเวลาไว้ใช้แสดงที่หัวข้อเว็บ
        document.getElementById("pageTitle").dataset.createdTime = createdTime;



            
            if (dateColumn === -1) {
                throw new Error("COMMENT_CHECK.csv ต้องมีคอลัมน์ date");
            }
            rows = rows.map(row => {
                const result = [...row];
                const [dateValue] = result.splice(dateColumn, 1);
                result.splice(2, 0, dateValue ?? "");
                return result;
            });

            const columns = Math.max(...rows.map(row => row.length));
            rows = rows.map(row => Array.from({ length: columns }, (_, i) => row[i] ?? ""));

            // เรียงเฉพาะแถวข้อมูลตาม clip_name (A-Z, ไม่สนตัวพิมพ์เล็กใหญ่)
            // คงหัวตาราง CSV สองแถวแรกไว้ และเรียงแบบตัวเลขตามธรรมชาติ เช่น clip2 ก่อน clip10
 
            const getClipSortRank = (name) => {
            const clipName = String(name).trim().toLowerCase();

            const index = clipSortOrder.findIndex(prefix =>
                clipName.startsWith(prefix.toLowerCase())
            );

            return index === -1 ? clipSortOrder.length : index;
        };

        const sortedClips = rows.slice(2).sort((a, b) => {
            const rankA = getClipSortRank(a[0]);
            const rankB = getClipSortRank(b[0]);

            if (rankA !== rankB) {
                return rankA - rankB;
            }

            return String(a[0]).localeCompare(String(b[0]), undefined, {
                sensitivity: "base",
                numeric: true
            });
        });




            
            rows = [...rows.slice(0, 2), ...sortedClips];

            const clipCount = Math.max(0, rows.length - 2);
            const totalUsers = Math.max(0, columns - 3);
            const commentedCounts = Array(columns).fill(0);
            const eligibleClipCounts = Array(columns).fill(clipCount);
            const commentedPerClip = Array(rows.length).fill(0);

            // กำหนดขอบเขตคลิปของแต่ละคนจากคอลัมน์เดิมก่อนเพิ่มคอลัมน์ยอด



            
         const userPrefixes = Array.from({ length: columns }, (_, c) =>
            c >= 3
                ? countPrefixesByColumn.get(c + 1)
                : undefined
        );

 
            
            for (let c = 3; c < columns; c++) {
                if (userPrefixes[c]) eligibleClipCounts[c] = 0;
            }

            for (let r = 2; r < rows.length; r++) {
                const clipNameForCount = String(rows[r][0]).trim().toLowerCase();
                for (let c = 3; c < columns; c++) {
                    const commented = isCommented(rows[r][c]);
                    // จำนวนคอมเมนต์ต่อคลิปยังคงนับทุก User ที่มีเครื่องหมาย ✓
                    if (commented) commentedPerClip[r]++;
                    const prefixes = userPrefixes[c];
                    const eligible = !prefixes || prefixes.some(prefix => clipNameForCount.startsWith(prefix));
                    if (eligible) {
                        if (prefixes) eligibleClipCounts[c]++;
                        if (commented) commentedCounts[c]++;
                    }
                }
            }



 
        // ==========================================================
        // คำนวณยอดหลังชื่อคลิป ตามช่วงหมายเลขคอลัมน์
        // คลิปอื่นที่ไม่กำหนดกลุ่ม จะนับทุก User
        // จุดที่ 2 — แก้ส่วนคำนวณยอดหลังชื่อคลิป
        // ==========================================================
        const clipUserTotals = Array(rows.length).fill(totalUsers);

        for (let r = 2; r < rows.length; r++) {
            const clipName = String(rows[r][0]).trim().toLowerCase();

            const group = clipCountGroups.find(g =>
                g.prefixes.some(prefix =>
                    clipName.startsWith(prefix.toLowerCase())
                )
            );

            // ไม่อยู่ในกลุ่มที่กำหนด -> ใช้ยอดทุก User ตามเดิม
            if (!group) continue;

            const [start, end] = group.columns;
            let found = 0;
            let total = 0;

            // c เป็น index เริ่มจาก 0; คอลัมน์หน้าเว็บ = c + 1
            for (let c = 3; c < columns; c++) {
                const columnNumber = c + 1;

                if (columnNumber >= start && columnNumber <= end) {
                    total++;

                    if (isCommented(rows[r][c])) {
                        found++;
                    }
                }
            }

            commentedPerClip[r] = found;
            clipUserTotals[r] = total;
        }


        // end   จุดที่ 2 — แก้ส่วนคำนวณยอดหลังชื่อคลิป

            
            const table = document.getElementById("commentsTable");
            table.replaceChildren();

            // แสดงคอลัมน์พิเศษ "ยอด" ต่อจากชื่อคลิป (ไม่ต้องแก้ CSV)
            // กฎ commentCountGroups, clipCountGroups, headerColorGroups
            // ยังใช้เลขคอลัมน์เดิมก่อนเพิ่มคอลัมน์ยอด เพื่อไม่ให้กลุ่มคลาดเคลื่อน
            const displayColumns = columns + 1;
            const visibleWidth = p => displayColumnWidth(p);
            const originalColumn = p => p === 0 ? 0 : p - 1;
            const visibleDividers = new Set(columnDividers.map(n => n === 0 ? 0 : n + 1));

            function decorateCell(cell, p) {
                const width = visibleWidth(p) + "px";
                cell.style.width = width;
                cell.style.minWidth = width;
                cell.style.maxWidth = width;
                if (p < 4) cell.classList.add(`freeze-${p}`);
                if (visibleDividers.has(p + 1)) cell.classList.add("column-divider");
                if (p === 0 && visibleDividers.has(0)) cell.classList.add("column-divider-left");
            }

            const colgroup = document.createElement("colgroup");
            for (let p = 0; p < displayColumns; p++) {
                const col = document.createElement("col");
                col.style.width = visibleWidth(p) + "px";
                colgroup.appendChild(col);
            }
            table.appendChild(colgroup);

            const thead = document.createElement("thead");
            const countRow = document.createElement("tr");
            const nameRow = document.createElement("tr");

            for (let p = 0; p < displayColumns; p++) {
                const c = originalColumn(p);
                // A-D ครอบทั้ง 2 แถว: ชื่อคลิป / ยอด / URL / date
                if (p < 4) {
                    const th = document.createElement("th");
                    const title = p === 1 ? "comment" : String(rows[0][c]);
                    th.textContent = title;
                    th.title = title;
                    th.rowSpan = 2;
                    decorateCell(th, p);
                    countRow.appendChild(th);
                    continue;
                }

                const group = headerColorGroups.find(g => {
                    const [from, to] = g.columns;
                    // ตำแหน่งเดิมจาก CSV (ก่อนเพิ่มยอด)
                    return c + 1 >= from && c + 1 <= to;
                });
                const countTh = document.createElement("th");
                countTh.textContent = `(${commentedCounts[c]}/${eligibleClipCounts[c]})`;
                countTh.title = countTh.textContent;
                const nameTh = document.createElement("th");
                nameTh.textContent = String(rows[0][c]);
                nameTh.title = nameTh.textContent;
                decorateCell(countTh, p);
                decorateCell(nameTh, p);
                if (group) {
                    countTh.style.backgroundColor = group.color;
                    nameTh.style.backgroundColor = group.color;
                }
                countRow.appendChild(countTh);
                nameRow.appendChild(nameTh);
            }
            thead.append(countRow, nameRow);
            table.appendChild(thead);

            const tbody = document.createElement("tbody");
            for (let r = 2; r < rows.length; r++) {
                const tr = document.createElement("tr");
                const clipName = String(rows[r][0]).toLowerCase();
                const matchedColor = clipRowColors.find(item => clipName.includes(item.keyword));
                if (matchedColor) {
                    tr.classList.add("clip-colored");
                    tr.style.setProperty("--clip-row-color", matchedColor.color);
                }

                for (let p = 0; p < displayColumns; p++) {
                    const td = document.createElement("td");
                    decorateCell(td, p);
                    if (p === 1) {
                        td.style.textAlign = "center";
                        td.textContent = `(${commentedPerClip[r]}/${clipUserTotals[r]})`;
                        td.title = td.textContent;
                    } else {
                        const c = originalColumn(p);
                        const value = String(rows[r][c]).trim();
                        if (c >= 3 && isCommented(value)) td.classList.add("yes");
                        if (c === 1 && /^https?:\/\//i.test(value)) {
                            const link = document.createElement("a");
                            link.className = "url";
                            link.href = value;
                            link.target = "_blank";
                            link.rel = "noopener noreferrer";
                            link.title = value;
                            link.textContent = value;
                            td.appendChild(link);
                        } else {
                            td.textContent = value;
                            td.title = value;
                        }
                    }
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
            table.appendChild(tbody);

            const tableWrap = document.getElementById("tableWrap");
            tableWrap.style.setProperty("--freeze-a-width", visibleWidth(0) + "px");
            tableWrap.style.setProperty("--freeze-ab-width", (visibleWidth(0) + visibleWidth(1)) + "px");
            tableWrap.style.setProperty("--freeze-abc-width", (visibleWidth(0) + visibleWidth(1) + visibleWidth(2)) + "px");
            document.getElementById("summary").innerHTML =
                `<a href="https://docs.google.com/spreadsheets/d/1CTi0ZpyTyESYyiiYXDZdk5m1mq5X81VOW-ObHezuJ5o/edit?gid=886166879#gid=886166879" target="_blank">จำนวนคลิป</a>: ${clipCount} |
                 <a href="https://docs.google.com/spreadsheets/d/1CTi0ZpyTyESYyiiYXDZdk5m1mq5X81VOW-ObHezuJ5o/edit?gid=1397412964#gid=1397412964" target="_blank">จำนวนบัญชี</a>: ${totalUsers}`;
        }

        function setCellWidth(cell, column) {
            const width = displayColumnWidth(column) + "px";
            cell.style.width = width;
            cell.style.minWidth = width;
            cell.style.maxWidth = width;
        }

        // ==========================================================
        // 7. โหลดข้อมูลบน GitHub Pages (ไม่ใช้ PHP หรือฐานข้อมูล)
        // ==========================================================
        async function loadData() {
            const errorBox = document.getElementById("errorMessage");
            const tableWrap = document.getElementById("tableWrap");

            errorBox.classList.add("hidden");
            tableWrap.classList.add("hidden");
            document.getElementById("summary").textContent = "กำลังโหลด COMMENT_CHECK.csv...";

            try {
                const response = await fetch(csvFileName, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`โหลด ${csvFileName} ไม่สำเร็จ (HTTP ${response.status})`);
                }

                const csvText = decodeCsv(await response.arrayBuffer());
                drawTable(parseCsv(csvText));
                tableWrap.classList.remove("hidden");

             
               // วันที่ปัจจุบันตามเวลาไทย + เวลาที่กำหนดเอง
            const today = new Intl.DateTimeFormat("en-GB", {
                timeZone: "Asia/Bangkok",
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }).format(new Date());

            const pageTitle = document.getElementById("pageTitle");
            const createdTime = pageTitle.dataset.createdTime || "--:--";

            pageTitle.textContent =
            `ตรวจสอบคอมเมนต์ TikTok ${today} ${createdTime}`;




                
              } catch (error) {
                   errorBox.textContent = String(error.message || error);
                  errorBox.classList.remove("hidden");
                 document.getElementById("summary").textContent = "ไม่สามารถแสดงข้อมูลได้";
             }
         }

        loadData();
    </script>
</body>
</html>
